[game]
rom       = "."
width     = 64
height    = 64

[scripts]
libs     = []
includes = ["../lib/assert.js"]
entry    = "main.js"

# rpgmaker-mv/logic/pure-common-events: un proceso paralelo puro (evento comun o
# evento del mapa) no se repite si su ultima ejecucion no cambio nada y lo
# que mira y cambia sigue igual
[hooks]
"Game_CommonEvent.prototype.update" = "rpgmaker-mv/logic/pure-common-events"
"Game_Event.prototype.updateParallel" = "rpgmaker-mv/logic/pure-common-events"
