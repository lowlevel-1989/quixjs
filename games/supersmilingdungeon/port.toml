# port.toml: el port de Super Smiling Dungeon (ChoKo, GDevelop 5) a quixjs.
#
# Es el archivo que describe el juego: quixjs -c port.toml. La primera parte
# salio de quixjs --gen-config sobre su app/ (la version 1.2.5 de Steam),
# revisada a mano. El juego no va en el port: el jugador copia su
# resources/app.asar junto a este port.toml (README.md).
#
# Los scripts son los <script> del index.html, en el mismo orden. Despues van
# los del port: entry.js (los logros de Steam), render-scale.js (dibujar a la
# resolucion de la pantalla) y tutorial-fix.js (un fallo del tutorial que
# llenaba la pantalla de casillas negras). El juego solo usa el raton: el mod controller lo
# lleva con el mando.
[engine]
name    = "html5"
pixi    = "7.4.2"
nwjs    = true    # fs: el juego guarda su progreso en archivos (Documents de Electron: gamedata/)
scaling = "sharp"
# GDevelop carga todas sus imagenes al empezar: de cada una solo el tamano;
# se decodifica al subirla a la GPU (cuando se dibuja) y se suelta de la CPU
lazy_images = true
# en una portatil, 30 imagenes por segundo: un ritmo estable (a 60 saltaba
# entre 40 y 60); el juego mide el tiempo, no va mas lento
fps     = 30

# en el PC (el binario que no es el de PortMaster): 60
[engine.pc]
fps = 60

[game]
title     = "Super Smiling Dungeon"
version   = "0.1.0"           # la del port
id        = "supersmilingdungeon"
# la rom: el app.asar del juego (resources/app.asar en su carpeta de Steam),
# tal cual, junto a este port.toml. game_dir: donde empieza el juego dentro.
# Lo que el juego escribe (partidas) va a gamedata/, la carpeta de quixjs
rom       = "app.asar"
game_dir  = "app"
width     = 1280              # data.js: windowWidth y windowHeight
height    = 950
developer = "ChoKo"
releasedate = "20250101T000000"
genres    = ["rpg", "puzzle"]
mods      = ["controller", "big-text", "achievements", "fast-text"]   # mods/: controller (jugar con mando), big-text (letra mas grande), achievements (logros en letra grande), fast-text (B completa el texto o pasa al siguiente)
# 686 imagenes de 512 px o mas, ~2,2 GB decodificadas, y GDevelop las carga
# todas al empezar: en una portatil, a la escala con la que el juego cabe en
# la pantalla, guardadas reducidas en cache/images-<porcentaje>
image_scale      = "auto"
image_scale_dirs = [""]       # todas: GDevelop las deja en la raiz de app/
image_scale_min  = 512
# dibujar a la resolucion con la que se ve (render-scale.js): en una pantalla
# de 720x720, a 720x534; en una igual o mas grande, como siempre
render_scale     = "auto"
desc      = "Super Smiling Dungeon, a dungeon card game by ChoKo made with GDevelop, running on quixjs, a JS runtime in C with SDL2 and OpenGL ES 2."

# las partidas: localStorage y los archivos que guarda el juego con su
# extension FileSystem (muertes, partida terminada...), en gamedata/
[saves]
local_storage = "localstorage.json"
files         = ["localstorage.json", "SuperSmilingDungeon/Save/*"]

