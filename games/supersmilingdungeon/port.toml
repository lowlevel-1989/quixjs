# el <script> del final del index.html: crea el juego y lo empieza
entry    = "data:text/javascript,\n\n    (function() {\n        //Initialization\n        var game = new gdjs.RuntimeGame(gdjs.projectData, {});\n\n        //Create a renderer\n        game.getRenderer().createStandardCanvas(document.body);\n\n        //Bind keyboards/mouse/touch events\n        game.getRenderer().bindStandardEvents(game.getInputManager(), window, document);\n\n        //Load all assets and start the game\n        game.loadAllAssets(function() {\n            game.startGameLoop();\n        });\n    })();\n\n\t"

[controls]
gamepad = true                # lo lee el mod controller
# Select + R1: captura de pantalla; Select + L1: la lupa. Con true, Controls
# pide tambien un boton suelto para cada una (el combo sigue)
screenshot = true
magnifier  = true

# lo que hace cada boton (mods/controller)
[controls.buttons]
dpup    = "Cursor up"
dpdown  = "Cursor down"
dpleft  = "Cursor left"
dpright = "Cursor right"
a       = "Click"
b       = "Skip text"

# ---------- logros ----------
# Los de Steam: el juego los pide con gdjs.steamworks.claimAchievement(nombre)
# y entry.js deja cada nombre en quix.steam.achievements (como el
# greenworks de quixjs en Gunfield). Los nombres salen de su codigo (code*.js);
# las descripciones, de su pantalla de logros (en ingles); los titulos, de su
# pagina de Steam, que solo muestra 26 de 63: los que llevan * son propios.
[symbols]
a_tuto_fini                  = "path:quix.steam.achievements.ACHIEVEMENT_TUTO_FINI"
