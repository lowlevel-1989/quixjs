# port.toml: el port de Million Monster Militia (Space Capsule Games y
# Dejobaan Games, Construct 3) a quixjs.
#
# Es el archivo que describe el juego: quixjs -c port.toml. La primera parte
# salio de quixjs --gen-config sobre su package.nw (la version de Steam),
# revisada a mano. El juego no va en el port: el jugador copia el package.nw
# de su Steam junto a este port.toml (README.md).
#
# Construct 3 lo exporto para NW.js. El juego solo usa el raton: el mod
# controller lo lleva con el mando.
[engine]
name    = "construct3"
nwjs    = true
# en una portatil, 30 imagenes por segundo
fps     = 30

# en el PC (el binario que no es el de PortMaster): 60
[engine.pc]
fps = 60

[game]
title     = "Million Monster Militia"
version   = "0.9.0"           # la del port
id        = "millionmonstermilitia"
# la rom: el package.nw del juego (un zip), junto a este port.toml. Lo que el
# juego escribe va a gamedata/
rom       = "package.nw"
game_dir  = ""
# el juego es de 480x270 (pixel art) y Construct 3 lo escala a la ventana:
# al triple, la letra se lee y los pixeles quedan iguales
width     = 1440
height    = 810
# en una pantalla mas pequena, Construct 3 dibuja a la resolucion de la
# pantalla, no a 1440x810 para reducirlo despues (720x405 en una de 720x720)
render_scale = "auto"
player    = "Master"          # el nombre del jugador (el de Steam en el juego)
developer = "Space Capsule Games"
publisher = "Dejobaan Games"
genres    = ["strategy", "casino/card"]
mods      = ["controller", "achievements", "reader"]
                              # mods/: controller (jugar con mando),
                              # achievements (Start: la lista de logros) y
                              # reader (R1: los textos con letra grande) vienen
                              # activos; battle-music (musica en la batalla), apagado
desc      = "A roguelite deckbuilding auto-battler: play monster cards to defend the city from waves of kaiju."

# los de Construct 3 (runtime/engines/construct3/hooks.toml): las texturas
# de las pantallas se quedan al cambiar de pantalla
[hooks]
engine = "construct3"
# los savestates (Select + X guarda, Select + Y carga): probados en este juego
"C3.Runtime.prototype.Start" = "construct3/extra/port/savestate"
# el juego tiene el 3D activado sin usarlo: dibujado como 2D (en la Mali la
# capa HUD de la pantalla del jefe no salia; ver el archivo)
"C3.Runtime.prototype.Uses3DFeatures" = "construct3/extra/render/flat-2d"
# empezar una partida para los trucos (quix.playthrough): hooks/playthrough-new.js
"C3.Layout.prototype._StartRunning" = "hooks/playthrough-new"

[portmaster]
script       = "Million Monster Militia.sh"
porter       = ["lowlevel.1989"]
inst         = "Needs Million Monster Militia for Windows (Steam). Copy its file package.nw, as it is, into ports/millionmonstermilitia/, next to port.toml."
store        = { name = "Steam", url = "https://store.steampowered.com/app/2358770/" }
availability = "paid"

[saves]
local_storage = "localstorage.json"
files         = ["localstorage.json"]

# los <script> del index.html, en el mismo orden
[scripts]
libs     = []
includes = [
  "scripts/modernjscheck.js",
  "scripts/supportcheck.js"
]
entry    = "scripts/main.js"

# los elementos con id del <body> del index.html: quixjs los crea en el
# body cuando el juego los pide (getElementById)
[html]
elements = [
  { tag = "div", id = "notSupportedWrap" },
  { tag = "h2", id = "notSupportedTitle" },
]

[controls]
gamepad = true                # lo lee el mod controller
screenshot = true
magnifier  = true

# lo que hace cada boton (mods/controller; start: mods/achievements; r1:
# mods/reader)
[controls.buttons]
dpup    = "Cursor up"
dpdown  = "Cursor down"
dpleft  = "Cursor left"
dpright = "Cursor right"
a       = "Click"
x       = "Menu"
y       = "Action button"
start   = "Achievements"
r1      = "Reader"

# ---------- los logros ----------
# Million Monster Militia los da con Steam (greenworks): quixjs contesta por
# Steam y deja cada id que el juego activa en quix.steam.achievements (y, una
# vez, en gamedata/steam-achievements.txt). Los 77 ids salen de la API publica
# de Steam (GetGlobalAchievementPercentagesForApp, app 2358770) y del codigo del
# juego (scripts/c3runtime.js):
#   ACHIEVEMENT_WON_CITY<n>  ganar la ciudad n de City.json (del juego; 0 Cape
#                            Cod, 1 Boston...). 64 de las 75 tienen logro
#   ACHIEVEMENT_WON_STANDARD, 2, 4 y SENDTOHELL  las misiones 1, 2, 4 y 3
#   ACHIEVEMENT_WON_PERSIST, STANDARD6, LUMP, ALWAYSEMP, BANNED, ALLRARE y
#     FINAL  las misiones 5 a 11: en el codigo van seguidos despues de las 4
#     primeras, y en Steam su porcentaje baja en ese orden (4.1 % a 1.6 %)
#   ACHIEVEMENT_WON_CUSTOM   ganar una partida personalizada (va aparte, al final)
# Los titulos y descripciones son los de su pagina de Steam, que solo muestra
# 26. Las ciudades que faltan llevan el nombre de City.json, como las demas
# ("Beat <ciudad>"). Las misiones 5 a 11 y la personalizada llevan un titulo
# neutro ("Mission 5", "Custom Game"): Steam no muestra los suyos.
[symbols]
start_the_game     = "path:quix.steam.achievements.ACHIEVEMENT_START_THE_GAME"
won_standard       = "path:quix.steam.achievements.ACHIEVEMENT_WON_STANDARD"
won_standard2      = "path:quix.steam.achievements.ACHIEVEMENT_WON_STANDARD2"
won_sendtohell     = "path:quix.steam.achievements.ACHIEVEMENT_WON_SENDTOHELL"
won_standard4      = "path:quix.steam.achievements.ACHIEVEMENT_WON_STANDARD4"
won_standard6      = "path:quix.steam.achievements.ACHIEVEMENT_WON_STANDARD6"
won_custom         = "path:quix.steam.achievements.ACHIEVEMENT_WON_CUSTOM"
won_persist        = "path:quix.steam.achievements.ACHIEVEMENT_WON_PERSIST"
won_lump           = "path:quix.steam.achievements.ACHIEVEMENT_WON_LUMP"
won_alwaysemp      = "path:quix.steam.achievements.ACHIEVEMENT_WON_ALWAYSEMP"
won_banned         = "path:quix.steam.achievements.ACHIEVEMENT_WON_BANNED"
won_allrare        = "path:quix.steam.achievements.ACHIEVEMENT_WON_ALLRARE"
won_final          = "path:quix.steam.achievements.ACHIEVEMENT_WON_FINAL"
won_city0          = "path:quix.steam.achievements.ACHIEVEMENT_WON_CITY0"
