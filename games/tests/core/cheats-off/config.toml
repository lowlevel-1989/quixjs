[game]
cache_dir = "cache/tests/core/cheats-off"
game_dir  = "games/tests/core/cheats-off"
width     = 320
height    = 240

[scripts]
libs     = []
includes = ["../../lib/assert.js"]
entry    = "main.js"

# sin fichero: cada vez empiezan sin conseguir
[saves]
achievements = ""

[symbols]
encounters = "path:$gameSystem._encounterEnabled"
gold       = "path:game.gold"

[[achievements]]
id         = "rich"
title      = "Rich"
conditions = ["gold >= 100"]

# no esta activo (no hay quixjs-settings.toml)
[[cheat]]
id   = "no_encounters"
name = "No random encounters"
set  = { encounters = false }
