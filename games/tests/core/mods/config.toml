# Mods: [game] mods son los activos (mods/<nombre>/ junto a este config.toml,
# con las rutas de dentro de [game] game_dir). Si dos traen el mismo archivo,
# gana el ultimo; "off" no esta activo.
[game]
rom       = "game"
width     = 320
height    = 240
mods      = ["uno", "dos"]

[scripts]
libs     = []
includes = ["../lib/assert.js", "lib.js"]
entry    = "main.js"

# el hook del juego; el mod dos pone el suyo encima (mods/dos/hooks.toml)
[hooks]
"Game.hit" = "skip"

# el juego vibra: sin esto navigator.vibrate no hace nada
[controls]
vibration = true
