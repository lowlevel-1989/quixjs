[game]
cache_dir = "cache/tests/core/refresh-partial"
game_dir  = "games/tests/core/refresh-partial"
width     = 64
height    = 64

[scripts]
libs     = []
includes = ["../../lib/assert.js"]
entry    = "main.js"

# rpgmaker-mv/refresh-on-net-change: con cambios de verdad, solo se refrescan
# los eventos que dependen de lo que cambio; las paginas, las mismas que con
# el refresco completo
[hooks]
"Game_Map.prototype.refresh" = "rpgmaker-mv/refresh-on-net-change"
