# La vibracion: navigator.vibrate, gamepad.vibrationActuator y los presets de
# runtime/engines/lib/rumble.js. Con el backend sdl (args) y el mando virtual
# de SDL (quix.pressPad); sin ventana. El mando virtual no vibra: se mira lo
# que ve el juego (las promesas, los tiempos), no el motor
[game]
cache_dir = "cache/tests/core/vibration"
game_dir  = "games/tests/core/vibration"
width     = 64
height    = 64

[scripts]
libs     = []
includes = ["../../lib/assert.js"]
entry    = "main.js"

# el juego vibra: sin esto navigator.vibrate no hace nada
[controls]
vibration = true
