# [controls.keys]: acciones con nombre que pulsan una tecla; su boton, el
# de controller.keys (lo que guarda Controls). Con el backend sdl (args) y el
# mando virtual de SDL (quix.input.pressPad); sin ventana
[game]
rom       = "."
width     = 64
height    = 64

[scripts]
libs     = []
includes = ["../lib/assert.js"]
entry    = "main.js"

[controls.keys]
Torch = "T"
Phase = "C"
