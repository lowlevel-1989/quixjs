# port.toml: el port de Felvidék a quixjs.
#
# Es el archivo que describe el juego: quixjs -c port.toml. La primera parte
# ([engine], [game], [saves], [fonts], [scripts]) salio de quixjs
# --gen-config sobre Felvidék 1.04 (GOG), revisada a mano. Sirve en cualquier
# sitio donde corre quixjs, con el juego copiado en gamedata/. [portmaster]
# es lo que pide PortMaster (make portmaster PORT=felvidek genera con
# ella su port.json, su gameinfo.xml y el script .sh del port).
#
# [game] title es el de su data/System.json ("Felvidek", sin tilde: la app
# de Android reconoce asi el juego de un .zip); el de PortMaster lleva tilde.

[engine]
name    = "rpgmaker-mv"
version = "1.6.1"
pixi    = "4.5.4"
nwjs    = true   # package.json de nw.js: require('fs'), process...
# en una portatil, 30 imagenes por segundo (RPG Maker sigue con 60 pasos)
fps     = 30
# como Fear & Hunger: el GC antes, el heap no crece de mas (1 GB de RAM)
js_memory = 128

[engine.pc]
fps = 60

[game]
title     = "Felvidek"
version   = "0.1.1"           # la del port
id        = "felvidek"
# la rom: la carpeta www/ del juego comprimida en un .zip, junto a este
# port.toml. game_dir: donde empieza el juego dentro de la rom (la carpeta
# www/ de dentro). Lo que el juego escribe (partidas) va a gamedata/, la
# carpeta de quixjs junto a este port.toml
rom       = "www.zip"
game_dir  = "www"
# el juego cambia la pantalla a 960x720 (package.json dice 816x624)
width     = 960
height    = 720
mods      = ["big-text"]   # mods/: big-text (el texto de las ventanas mas grande) viene activo;
                           # readable-font (fuente mas legible), apagado
developer = "Jozef Pavelka, Vlado Ganaj"
publisher = "Tutto Passa"
releasedate = "20240329T000000"
genres    = ["rpg"]
desc      = "A story-driven RPG set in 15th-century Upper Hungary: Jaromir, a knight with a taste for wine, investigates a strange cult across a land of wars and plague."

[saves]
dir   = "save"
files = ["*.rpgsave"]

# fuentes de los @font-face de su CSS
[fonts]
"GameFont" = "fonts/ArgestaHeadline-Regular.otf"

# los <script> del index.html, en el mismo orden
[scripts]
libs     = [
  "js/libs/pixi.js",
  "js/libs/pixi-tilemap.js",
  "js/libs/pixi-picture.js",
  "js/libs/fpsmeter.js",
  "js/libs/lz-string.js",
  "js/libs/iphone-inline-video.browser.js"
]
includes = [
  "js/rpg_core.js",
  "js/rpg_managers.js",
  "js/rpg_objects.js",
  "js/rpg_scenes.js",
  "js/rpg_sprites.js",
  "js/rpg_windows.js",
  "js/plugins.js"
]
entry    = "js/main.js"

# ---------- PortMaster ----------
[portmaster]
title        = "Felvidék"
script       = "Felvidek.sh"
porter       = ["lowlevel.1989"]
inst         = "Needs Felvidek for Windows (GOG or Steam). Compress its folder www/ into www.zip (a zip without compression is best; a compressed one also works, the first start takes longer) and copy it into ports/felvidek/, next to port.toml."
store        = { name = "GOG", url = "https://www.gog.com/game/felvidek" }
availability = "paid"

# ---------- hooks ----------
# Los de RPG Maker MV (runtime/engines/rpgmaker-mv/hooks.toml)
[hooks]
engine = "rpgmaker-mv"
# los savestates (Select + X guarda, Select + Y carga): experimentales
"Scene_Boot.prototype.start" = "rpgmaker/extra/port/savestate"

[controls]
gamepad = true
# Select + R1: captura de pantalla; Select + L1: la lupa (cartas, notas). Con
# true, Controls pide tambien un boton suelto para cada una (el combo sigue)
screenshot = true
magnifier  = true

# los botones que usa el juego, con los nombres de su GamepadConfig: Controls
# los pide por su nombre (y siempre las dos palancas)
[controls.buttons]
dpup    = "Move up"
dpdown  = "Move down"
dpleft  = "Move left"
dpright = "Move right"
a       = "OK / Talk"
b       = "Cancel"
x       = "Dash"
y       = "Menu"
l1      = "Previous (menu)"
r1      = "Next (menu)"
