# port.toml: el port de HexGL a quixjs.
#
# Es el archivo que describe el juego: quixjs -c port.toml. HexGL es libre
# (https://github.com/BKcore/HexGL), pero no va en el port: el jugador lo
# baja de su GitHub y copia su carpeta en gamedata/ (README.md).
#
# Su menu es HTML (index.html y launch.js): quixjs no dibuja HTML. El del
# port es entry.js, en un canvas, junto a este archivo; los demas scripts son
# los <script> del index.html, en el mismo orden (sin los que no se usan:
# Google Analytics, Leap Motion, Stats y DAT.GUI).

[engine]
name    = "html5"
nwjs    = false
fps     = 60

[game]
title     = "HexGL"
version   = "0.1.0"           # la del port
id        = "hexgl"
# la rom: el zip del juego, tal cual se descarga de GitHub, junto a este
# port.toml. game_dir: donde empieza el juego dentro de la rom (la carpeta del
# zip de GitHub). Lo que el juego escribe (partidas) va a gamedata/, la
# carpeta de quixjs junto a este port.toml
rom       = "HexGL-6addc95a2fce3bf05f4d751823cc054c61a16d68.zip"
game_dir  = "HexGL-6addc95a2fce3bf05f4d751823cc054c61a16d68"
# 4:3 como la pantalla de muchas portatiles; HexGL dibuja al tamano de la
# ventana (window.innerWidth/innerHeight)
width     = 640
height    = 480
mods      = ["volume", "multiplayer", "rumble"]   # mods/, activos: volume (Music y Effects
                                                # en el menu), multiplayer (carreras entre
                                                # handhelds) y rumble (vibracion)
developer = "Thibaut Despoulain (BKcore)"
publisher = "Thibaut Despoulain (BKcore)"
releasedate = "20121101T000000"
genres    = ["racing"]
desc      = "A futuristic racing game in the style of the classic anti-gravity racers: race your ship around a neon track at high speed."

# la fuente del HUD y del menu (css/fonts.css)
[fonts]
"BebasNeueRegular" = "css/BebasNeue-webfont.ttf"

[scripts]
libs     = [
  "libs/Three.dev.js",
  "libs/ShaderExtras.js",
  "libs/postprocessing/EffectComposer.js",
  "libs/postprocessing/RenderPass.js",
  "libs/postprocessing/BloomPass.js",
  "libs/postprocessing/ShaderPass.js",
  "libs/postprocessing/MaskPass.js",
  "libs/Detector.js"
]
includes = [
  "bkcore.coffee/controllers/TouchController.js",
  "bkcore.coffee/controllers/OrientationController.js",
  "bkcore.coffee/controllers/GamepadController.js",
  "bkcore.coffee/Timer.js",
  "bkcore.coffee/ImageData.js",
  "bkcore.coffee/Utils.js",
  "bkcore/threejs/RenderManager.js",
  "bkcore/threejs/Shaders.js",
  "bkcore/threejs/Particles.js",
  "bkcore/threejs/Loader.js",
  "bkcore/Audio.js",
  "bkcore/hexgl/HUD.js",
  "bkcore/hexgl/RaceData.js",
  "bkcore/hexgl/ShipControls.js",
  "bkcore/hexgl/ShipEffects.js",
  "bkcore/hexgl/CameraChase.js",
  "bkcore/hexgl/Gameplay.js",
  "bkcore/hexgl/tracks/Cityscape.js",
  "bkcore/hexgl/HexGL.js"
]
entry    = "../entry.js"   # games/hexgl/entry.js (en el zip, junto a port.toml)

# Transfer Save: HexGL guarda en localStorage sus records y repeticiones, y
# entry.js los ajustes del menu y los mejores tiempos; quixjs lo guarda en
# gamedata/localstorage.json
[saves]
files         = ["localstorage.json"]
local_storage = "localstorage.json"

[controls]
gamepad = true
# Select + R1: captura de pantalla; Select + L1: la lupa. Con true, Controls
# pide tambien un boton suelto para cada una (el combo sigue)
screenshot = true
magnifier  = true
vibration = true   # el mod rumble (choques, nave destruida, turbo); Options > Vibration

# los botones de HexGL (bkcore.coffee/controllers/GamepadController.js); la
# cruceta gira igual que la palanca (entry.js)
[controls.buttons]
dpleft       = "Turn left"
dpright      = "Turn right"
a            = "Accelerate"
lefttrigger  = "Air brake left"
righttrigger = "Air brake right"

# el truco de la opcion Cheats (HexGL no tiene logros: se aplica sin mas)
[symbols]
shield_damage = "path:hexGL.components.shipControls.shieldDamage"

[[cheat]]
id          = "no_damage"
name        = "No damage"
description = "Crashes do not take shield: the ship is never destroyed."
set         = { shield_damage = 0 }

# ---------- PortMaster ----------
[portmaster]
script       = "HexGL.sh"
porter       = ["lowlevel.1989"]
inst         = "Needs HexGL, free: open https://github.com/BKcore/HexGL/tree/6addc95a2fce3bf05f4d751823cc054c61a16d68, download it with Code, Download ZIP, and copy that zip, as it is, into ports/hexgl/, next to port.toml."
store        = { name = "GitHub", url = "https://github.com/BKcore/HexGL" }
availability = "free"
