# ---------- PortMaster ----------
[portmaster]
script       = "Gunfield.sh"
porter       = ["lowlevel.1989"]
inst         = "Needs Gunfield for Windows (Steam). Copy its file package.nw, as it is, into ports/gunfield/, next to port.toml."
store        = { name = "Steam", url = "https://store.steampowered.com/app/2305900/" }
availability = "paid"
