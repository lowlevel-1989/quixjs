entry    = "entry.js"

[controls]
gamepad = true
vibration = true            # las chapas vibran al chocar

# el nombre con que Controls (el launcher) ensena cada boton
[controls.buttons]
a     = "Shoot / OK"
b     = "Fine aim / Back"
x     = "Shot on goal"
y     = "Cap card"
start = "Pause"
l1    = "Previous cap"
r1    = "Next cap"
l2    = "Whole pitch"
r2    = "Whole pitch"

# lo que pide PortMaster (make portmaster PORT=soccer-chapa): el juego va
# dentro del port (game/), no hay que copiar nada
[portmaster]
script       = "Soccer Chapa.sh"
porter       = ["lowlevel.1989"]
inst         = "Ready to play: the game comes with the port."
availability = "free"
