# Soccer Chapa: el futbol de chapas, el primer juego hecho para quixjs.
# Es el toml del juego: quixjs -c port.toml. El juego viene dentro, en game/.

[engine]
name = "html5"
fps  = 60

[game]
title     = "Soccer Chapa"
version   = "0.9.0"
id        = "soccer-chapa"
rom       = "game"            # el juego va en game/ (la rom de este port)
game_dir  = ""
language  = "en"              # el juego empieza en ingles; el español, en Opciones
width     = 1280
height    = 720
# a pantalla completa el ancho sigue la forma de la pantalla y la camara
# ensena mas o menos campo (runtime/core/main/window.c)
fit       = "screen"
developer = "lowlevel.1989"
publisher = "lowlevel.1989"
genres    = ["sports"]
desc      = "Bottle cap football: flick your caps, one shot each, and score. Tournaments for up to 16 players, local or over the network."

# la partida (perfiles, cartas, ajustes): el localStorage en disco, firmado
# por el juego con quix.storage.sign (src/save/store.js)
[saves]
dir           = "save"
files         = ["localstorage.json"]
local_storage = "localstorage.json"

# Montserrat (OFL, fonts/Montserrat-OFL.txt): la letra de la interfaz
[fonts]
"Montserrat Black"        = "fonts/Montserrat-Black.otf"
"Montserrat Black Italic" = "fonts/Montserrat-BlackItalic.otf"
"Montserrat Bold"         = "fonts/Montserrat-Bold.otf"
"Montserrat SemiBold"     = "fonts/Montserrat-SemiBold.otf"

[scripts]
libs     = ["lib/pixi_v4/pixi.js"]
