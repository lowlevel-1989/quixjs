# port.toml: el port de OMORI a quixjs.
#
# Es el archivo que describe el juego: quixjs -c port.toml. La primera parte
# ([engine], [game], [saves], [fonts], [scripts]) salio de quixjs
# --gen-config sobre OMORI 1.0.0 (la rama v1.0.0 de Steam, la que pide el
# port), revisada a mano; despues, los controles, los hooks y los logros.
# Sirve en cualquier sitio donde corre quixjs (Linux de escritorio,
# portatiles...), con el juego copiado junto a este archivo.
#
# Cada forma de empaquetarlo tiene su seccion: [portmaster] es lo que pide
# PortMaster (make portmaster PORT=omori genera con ella su port.json, su
# gameinfo.xml y el script .sh del port).
#
# OMORI guarda sus plugins y datos cifrados (.OMORI, .KEL) con una clave que
# lleva dentro, y los descifra el mismo al arrancar con require('crypto'): el
# crypto de quixjs (runtime/binding/nwjs/crypto.js) hace eso, como nw.js.

[engine]
name    = "rpgmaker-mv"
version = "1.6.1"
pixi    = "4.8.9"
nwjs    = true   # package.json de nw.js: require('fs'), process...

[game]
title     = "OMORI"             # el del menu y el de PortMaster
version   = "1.0.0"             # la del port: subirla con cada cambio del port
id        = "omori"             # el id del juego: Transfer Save solo pasa partidas del mismo
# la rom: la carpeta www/ del juego comprimida en un .zip, junto a este
# port.toml. game_dir: donde empieza el juego dentro de la rom (la carpeta
# www/ de dentro). Lo que el juego escribe (partidas) va a gamedata/, la
# carpeta de quixjs junto a este port.toml
rom       = "www.zip"
game_dir  = "www"
width     = 640   # el juego dibuja a 640 (el package.json dice 680: la ventana)
height    = 480
mods      = ["controller-mode"]   # mods activos (mods/<nombre>/ junto al port.toml);
                                # controller-mode (el modo mando de OMORI siempre
                                # activo) viene activo
developer = "OMOCAT"
publisher = "OMOCAT"            # publisher y releasedate: van en gameinfo.xml (EmulationStation)
releasedate = "20201225T000000" # el 25 de diciembre de 2020, en Steam
genres    = ["rpg"]
desc      = "A psychological horror RPG: explore a strange world full of colorful friends and foes, and face your fears when the time comes."

# Transfer Save: que archivos pasa a otro dispositivo.
#   dir    la carpeta de las partidas, desde [game] game_dir
#   files  los archivos de esa carpeta (las partidas y las opciones)
[saves]
dir   = "save"   # en gamedata/: gamedata/www/save
files = ["*.rpgsave"]

# fuentes de los @font-face de su CSS
[fonts]
"GameFont" = "fonts/OMORI_GAME2.ttf"

# los <script> del index.html, en el mismo orden
[scripts]
libs     = [
  "js/libs/pixi.js",
  "js/libs/pixi-tilemap.js",
  "js/libs/pixi-picture.js",
  "js/libs/lz-string.js",
  "js/libs/iphone-inline-video.browser.js"
]
includes = [
  "js/rpg_core.js",
  "js/rpg_managers.js",
  "js/rpg_objects.js",
  "js/rpg_scenes.js",
  "js/rpg_sprites.js",
  "js/rpg_windows.js",
  "js/plugins.js"
]
entry    = "js/main.js"

[portmaster]
script       = "OMORI.sh"
porter       = ["lowlevel.1989"]
inst         = "Needs OMORI 1.0.0 for Windows (Steam: the v1.0.0 branch in Properties, Betas). Compress its folder www/ into www.zip (a zip without compression is best; a compressed one also works, the first start takes longer) and copy it into ports/omori/, next to port.toml."
store        = { name = "Steam", url = "https://store.steampowered.com/app/1150690/" }
availability = "paid"

# el mando: Controls en el launcher. OMORI usa sus teclas (Z aceptar, X menu
# y volver, Shift correr, Q / W paginas, A etiqueta; Enter y Escape no)
[controls]
gamepad = true

[controls.buttons]
dpup     = "Move up"
dpdown   = "Move down"
dpleft   = "Move left"
dpright  = "Move right"
a        = "OK (Z)"
b        = "Menu / Back (X)"
x        = "Run (Shift)"
y        = "Tag (A)"
l1       = "Page up (Q)"
r1       = "Page down (W)"

# los hooks de RPG Maker MV (runtime/engines/rpgmaker-mv/hooks.toml): entre
# ellos la opcion Achievements del menu del juego
[hooks]
engine = "rpgmaker-mv"
# los savestates (Select + X guarda, Select + Y carga): experimentales
"Scene_Boot.prototype.start" = "rpgmaker/extra/port/savestate"

# la opcion del menu, en mayusculas como las de OMORI
[achievements_menu]
name = "TROPHIES"

# ---------- logros ----------
# Los 85 de Steam, con sus nombres y descripciones (en ingles, del esquema de
# Steam). El juego los pide con steamworks.activateAchievement(id) desde sus
# eventos (plugin Archeia_Steamworks) y el greenworks de quixjs
# (runtime/binding/nwjs/greenworks.js) los deja en quix.steam.achievements.
# Los de vencer a alguien son progression; el resto, secondary
[symbols]
good_morning = "path:quix.steam.achievements.GOOD_MORNING"
oyasumi = "path:quix.steam.achievements.OYASUMI"
